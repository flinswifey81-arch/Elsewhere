name: Elsewhere Native Redesign Preview

on:
  push:
    branches: [work/elsewhere-redesign-2026-11-27]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Exercise real native preview screens and theme contrast
        run: |
          bash ./gradlew :app:testPhoneIntegrationUnitTest -Proborazzi.test.record=true --no-daemon --no-configuration-cache \
            --tests 'com.example.redesign.*' --tests 'com.example.phone.*' \
            --tests 'com.example.domain.backup.BackupRepositoryTest.encryptedBackupPreservesChatWorldAndCampaignCoversIndependently' \
            --tests 'com.example.ProfileImageRepositoryTest' --tests 'com.example.SoloGreetingPickerUiTest' \
            --tests 'com.example.ManualCharacterTest' --tests 'com.example.ManualPersonaTest' \
            --tests 'com.example.NpcLibraryPortraitTest' --tests 'com.example.SoloSpotlightControlsTest' \
            --tests 'com.example.AppDatabaseMigrationTest.migrationFrom26To27KeepsExistingSettingsAndDefaultsToSpotlight' \
            --tests 'com.example.ChatDetailGenerationTest.naturalSoloCastAcceptsNpcOnlyReplyWithoutReassigningPriorSpotlightHistory' \
            --tests 'com.example.WorldArchiveAdditiveRestorerTest.npcPortraitSurvivesAsNewDossierImageWithoutTouchingOtherArt' \
            --tests 'com.example.domain.backup.BackupRepositoryTest' --tests 'com.example.ScenarioModeTest'
      - name: Print failing preview cases
        if: failure()
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for file in Path("app/build/test-results/testPhoneIntegrationUnitTest").glob("TEST-*.xml"):
              for test in ET.parse(file).getroot().iter("testcase"):
                  for f in test.findall("failure") + test.findall("error"):
                      print(test.get("name"), f.get("message"), (f.text or "")[:2400])
          PYTEST
      # The long-lived test signer lives outside CI. Do not look up a production
      # signer, and never ship an APK signed by the ephemeral runner debug key.
      - name: Prepare an unsigned input for the isolated Elsewhere Test signer
        env:
          ELSEWHERE_LAB_UNSIGNED: "1"
        run: |
          set -euo pipefail
          export ELSEWHERE_LAB_VERSION_CODE="$((1000 + GITHUB_RUN_NUMBER))"
          bash ./gradlew :app:assemblePhoneIntegration --no-daemon --no-configuration-cache
          apk="$(find app/build/outputs/apk/phoneIntegration -maxdepth 1 -name '*-unsigned.apk' | head -1)"
          test -s "$apk"
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt" dump badging "$apk" > "$RUNNER_TEMP/redesign-badging"
          grep -F "package: name='com.aistudio.elsewhere.abwzy.test.lab' versionCode='$ELSEWHERE_LAB_VERSION_CODE'" "$RUNNER_TEMP/redesign-badging"
          grep -F 'application-debuggable' "$RUNNER_TEMP/redesign-badging"
          if "$bt/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "::error::This signing input unexpectedly already contains a signature."
            exit 1
          fi
          cp "$apk" Elsewhere-Test-UNSIGNED.apk
          printf '%s\n' "$GITHUB_SHA" > SOURCE-COMMIT
          printf '%s\n' "$ELSEWHERE_LAB_VERSION_CODE" > VERSION-CODE
          sha256sum Elsewhere-Test-UNSIGNED.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Elsewhere-Test-Signing-Input-Not-Installable
          path: |
            Elsewhere-Test-UNSIGNED.apk
            SOURCE-COMMIT
            VERSION-CODE
            SHA256SUMS
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Elsewhere-Native-Redesign-Screens
          path: app/build/outputs/roborazzi/ui-review/redesign_*.png
          if-no-files-found: warn
          retention-days: 14
