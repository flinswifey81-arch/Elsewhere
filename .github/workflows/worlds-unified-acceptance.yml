name: Worlds and RP Integrated Acceptance

on:
  pull_request:
    branches:
      - main
      - feature/world-archive-test-ui-2026-11-05
  push:
    branches:
      - integration/worlds-and-rp-lifecycle-2026-11-06
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Push and both stacked PRs at the same HEAD need one acceptance run, not three.
  group: worlds-unified-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  integrated-sandbox:
    name: Validate Worlds archives and existing RP lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate World creation, history, encryption and additive recovery
        run: |
          bash ./gradlew :app:testSandboxUnitTest --no-daemon \
            --tests com.example.AppDatabaseMigrationTest \
            --tests com.example.WorldRepositoryTest \
            --tests com.example.WorldEpisodeContextCompilerTest \
            --tests com.example.LorebookUiTest.groupInspectorCompilesForExplicitlySelectedCharacter \
            --tests com.example.WorldDefinitionCodecTest \
            --tests com.example.WorldsScreenTest \
            --tests com.example.WorldArchiveManifestCodecTest \
            --tests com.example.WorldArchiveHistoryTest \
            --tests com.example.WorldArchiveEncryptedIOTest \
            --tests com.example.WorldArchiveAdditiveRestorerTest \
            --tests com.example.WorldArchiveTransferCoordinatorTest \
            --tests com.example.RetainedChatViewModelStoresTest \
            --tests com.example.ReplyNotificationPolicyTest \
            --tests com.example.NpcSceneCastResolverTest \
            --tests com.example.NpcSpeakerPortraitResolverTest \
            --tests com.example.NpcStructuredOutputParserTest \
            --tests com.example.StoryResponseTest \
            --tests com.example.domain.backup.BackupRepositoryTest \
            --tests com.example.ProfileImageRepositoryTest \
            --tests com.example.ChatMessageReadingUiTest \
            --tests com.example.OpenRouterModelProviderTest \
            --tests com.example.ChatDetailGenerationTest.continueFromCharacterGreetingNeedsNoPersonaTurn \
            --tests com.example.ChatDetailGenerationTest.malformedNarratedOutputIsSavedWithoutExposingControlMarkers \
            --tests com.example.ChatDetailGenerationTest.structuredContinueAppendsToTheSameLogicalResponseWithoutRepeatingSegments \
            --tests com.example.LocalGroupGenerationTest.groupRetryRegenerateAndContinueKeepSelectedSpeakerAndNonPersistedDirectorTurn \
            --tests com.example.ScenarioModeTest.oneRequestPortraysMultipleNpcsAndPreservesModelSettingsAndNarratorIdentity

      - name: Print focused test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for path in Path("app/build/test-results/testSandboxUnitTest").glob("TEST-*.xml"):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for failure in (*case.findall("failure"), *case.findall("error")):
                      print(f"FAIL: {case.get('classname')}.{case.get('name')}")
                      print(failure.get("message", ""))
                      print((failure.text or "")[:2500])
          PY
