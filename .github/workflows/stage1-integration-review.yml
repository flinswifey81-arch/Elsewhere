name: Stage 1 Memory Integration Review

on:
  pull_request:
    branches:
      - feature/stage2-local-retrieval-2026-11-10
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-regressions:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'work/memory-stage1-'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Stage 1 memory safety, backup, and generation regression
        run: |
          bash ./gradlew :app:testSandboxUnitTest --no-daemon \
            --tests com.example.domain.memory.* \
            --tests com.example.domain.StoryMemoryStorageTest \
            --tests com.example.StoryMemoriesScreenTest \
            --tests com.example.AppDatabaseMigrationTest \
            --tests com.example.domain.backup.BackupRepositoryTest \
            --tests com.example.WorldEpisodeContextCompilerTest \
            --tests com.example.domain.ContextResetPolicyTest \
            --tests com.example.domain.AutomaticMemoryManagerTest
      - name: Report precise test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path("app/build/test-results/testSandboxUnitTest")
          for report in root.glob("TEST-*.xml"):
              for case in ET.parse(report).getroot().iter("testcase"):
                  for failure in (*case.findall("failure"), *case.findall("error")):
                      print(f"FAIL: {case.get('classname')}.{case.get('name')}: {failure.get('message', '')}")
                      print((failure.text or "")[:3500])
          PY
