name: Stage 1 Memory Eligibility Contract

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elsewhere-stage1-memory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  memory-eligibility:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feature/stage1-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run offline memory ownership and reset policy contract
        run: |
          bash ./gradlew :app:testSandboxUnitTest --no-daemon \
            --tests com.example.domain.memory.StoryMemoryEligibilityPolicyTest \
            --tests com.example.domain.AutomaticMemoryManagerTest \
            --tests com.example.domain.ContextResetPolicyTest \
            --tests com.example.domain.StoryMemoryStorageTest \
            --tests com.example.AppDatabaseMigrationTest \
            --tests com.example.domain.backup.BackupRepositoryTest
      - name: Report exact failing memory tests
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path("app/build/test-results/testSandboxUnitTest")
          for report in root.glob("TEST-*.xml"):
              tree = ET.parse(report).getroot()
              for case in tree.iter("testcase"):
                  for failure in (*case.findall("failure"), *case.findall("error")):
                      print(f"FAIL: {case.get('classname')}.{case.get('name')}: {failure.get('message', '')}")
                      print((failure.text or "")[:4000])
          PY
