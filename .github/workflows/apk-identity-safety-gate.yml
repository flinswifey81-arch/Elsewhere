name: APK Identity and Production Signer Isolation Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/**'
      - 'qa/release/**'
      - 'qa/release_identity/**'
      - '.github/workflows/apk-identity-safety-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-identity-safety:
    name: QA-signed release APK, package isolation, signer-denial proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out candidate branch (never merge/install)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out pinned 1.5.2 release identity history
        uses: actions/checkout@v4
        with:
          ref: b2295d69877ba003e6473c8a40e1f7a514c560f7
          path: pinned-v15-identity
          persist-credentials: false
      - name: Assert immutable historical production signer baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys
          sys.path.insert(0, "qa/release")
          from apk_identity_gate import (
              PRODUCTION_CERT_SHA256, PRODUCTION_PACKAGE,
              V15_INSTALLED_VERSION_CODE, V15_INSTALLED_VERSION_NAME
          )
          old = Path("pinned-v15-identity/.github/workflows/build-v15-release-apk.yml").read_text()
          def require(name, expected):
              actual = re.search(r'expected_' + name + r'="([^"]+)"', old)
              assert actual and actual.group(1) == str(expected), f"Historical {name} has changed"
          require("legacy_signer", PRODUCTION_CERT_SHA256)
          require("package", PRODUCTION_PACKAGE)
          require("version_code", V15_INSTALLED_VERSION_CODE)
          require("version_name", V15_INSTALLED_VERSION_NAME)
          print("PRODUCTION_IDENTITY_BASELINE_PIN_PASS: original 1.5.2 release workflow")
          PY
      - name: Exercise both positive and fail-closed identity policies offline
        run: |
          python3 -m unittest discover -s qa/release -p 'test_apk_identity_gate.py' -v
          python3 -m unittest discover -s qa/release_identity -p 'test_*.py' -v
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK build tools
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate disposable signing identity for release-build verification only
        run: |
          set -euo pipefail
          umask 077
          qa_pass="$(openssl rand -hex 24)"
          echo "::add-mask::$qa_pass"
          echo "QA_STORE_PASSWORD=$qa_pass" >> "$GITHUB_ENV"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/elsewhere-disposable-qa-release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$qa_pass" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$qa_pass" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt \
            -alias upload -keyalg RSA -keysize 3072 -validity 2 \
            -storetype PKCS12 \
            -dname "CN=Elsewhere Ephemeral QA Only, O=Disposable CI, C=US" \
            -keystore "$RUNNER_TEMP/elsewhere-disposable-qa-release.jks" \
            -storepass "$qa_pass" -keypass "$qa_pass" > /dev/null 2>&1
          echo "QA_ONLY_SIGNER_CREATED: temporary certificate, no production key accessed"
      - name: Build release, sandbox and debug APK variants without installing
        run: |
          bash ./gradlew :app:assembleRelease :app:assembleSandbox :app:assembleDebug \
            --no-daemon --no-configuration-cache
      - name: Build historical v15 release APK using SAME disposable QA certificate
        working-directory: pinned-v15-identity
        run: bash ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache
      - name: Compare actual historical and current APK IDs and verified certificate continuity
        run: |
          set -euo pipefail
          python3 qa/release_identity/verify_apk_identity.py \
            --mode qa \
            --contract qa/release_identity/historical_v15_contract.json \
            --historical-apk pinned-v15-identity/app/build/outputs/apk/release/app-release.apk \
            --candidate-apk app/build/outputs/apk/release/app-release.apk \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --report "$RUNNER_TEMP/elsewhere-v15-candidate-qa-identity.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          record=json.loads((Path(os.environ['RUNNER_TEMP'])/'elsewhere-v15-candidate-qa-identity.json').read_text())
          assert record['status']=='QA_CHAIN_VERIFIED_PRODUCTION_RELEASE_BLOCKED'
          assert record['samePackage'] and record['historicalAndCandidateShareDisposableQaSigner']
          assert not record['usesPinnedProductionSigner']
          assert not record['eligibleForInPlaceProductionUpdate']
          print('ACTUAL_HISTORICAL_APK_QA_CHAIN_PASS: package and shared disposable signer verified')
          print('PRODUCTION_UPDATE_STILL_BLOCKED: not the installed signer; versionCodeIncreases=', record['versionCodeIncreases'])
          PY
      - name: Compare actual APK identities and require signer rejection for release
        run: |
          set -euo pipefail
          buildtools="$ANDROID_HOME/build-tools/36.0.0"
          aapt="$buildtools/aapt"
          apksigner="$buildtools/apksigner"
          qa_fingerprint="$(keytool -exportcert -keystore "$KEYSTORE_PATH" \
            -storepass:env STORE_PASSWORD -alias upload | \
            openssl dgst -sha256 -r | awk '{print $1}')"
          test "${#qa_fingerprint}" -eq 64
          python3 qa/release/apk_identity_gate.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --aapt "$aapt" --apksigner "$apksigner" \
            --mode qa-release --qa-signer "$qa_fingerprint"
          python3 qa/release/apk_identity_gate.py \
            --apk app/build/outputs/apk/sandbox/app-sandbox.apk \
            --aapt "$aapt" --apksigner "$apksigner" --mode sandbox
          python3 qa/release/apk_identity_gate.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --aapt "$aapt" --apksigner "$apksigner" --mode debug
          # It MUST be impossible to label the disposable QA-signed release
          # as compatible with the existing signed production installation.
          if python3 qa/release/apk_identity_gate.py \
              --apk app/build/outputs/apk/release/app-release.apk \
              --aapt "$aapt" --apksigner "$apksigner" --mode production \
              > "$RUNNER_TEMP/prod-denial.txt" 2>&1; then
            echo "FATAL: a nonproduction certificate passed the production signer gate" >&2
            exit 1
          fi
          grep -q "SIGNER_MISMATCH" "$RUNNER_TEMP/prod-denial.txt" || {
            echo "FATAL: production rejection was not caused by certificate mismatch" >&2
            exit 1
          }
          echo "APK_PRODUCTION_SIGNER_DENIAL_PASS: disposable test signer is NOT an upgrade signer"
          echo "QA builds must NOT be distributed, installed or mistaken for production"
      - name: Remove disposable signing key and transient output
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/elsewhere-disposable-qa-release.jks" ]; then
            shred --remove "$RUNNER_TEMP/elsewhere-disposable-qa-release.jks" 2>/dev/null || \
              rm -f "$RUNNER_TEMP/elsewhere-disposable-qa-release.jks"
          fi
          rm -f "$RUNNER_TEMP/prod-denial.txt"
          rm -f app/build/outputs/apk/release/app-release.apk
          rm -f app/build/outputs/apk/debug/app-debug.apk
          rm -f app/build/outputs/apk/sandbox/app-sandbox.apk
          rm -f pinned-v15-identity/app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/elsewhere-v15-candidate-qa-identity.json"
      # NO upload-artifact and NO install step. This pipeline is identity QA,
      # explicitly not a signed production release or a release-candidate APK.
