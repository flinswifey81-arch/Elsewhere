name: Stage 1 V15 Archive Compatibility

on:
  pull_request:
    branches:
      - feature/stage1-memory-storage-v16-2026-11-10

permissions:
  contents: read

concurrency:
  group: elsewhere-v15-archive-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backup-migration-tests:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'test/stage1-v15-backup-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run historical migration and encrypted-restore tests
        run: |
          bash ./gradlew :app:testSandboxUnitTest --no-daemon \
            --tests com.example.AppDatabaseMigrationTest \
            --tests com.example.domain.backup.BackupRepositoryTest
      - name: Print exact test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for p in Path("app/build/test-results/testSandboxUnitTest").glob("TEST-*.xml"):
              root = ET.parse(p).getroot()
              for case in root.iter("testcase"):
                  for failure in (*case.findall("failure"), *case.findall("error")):
                      print("FAIL:", case.get("classname"), case.get("name"))
                      print(failure.get("message", ""))
                      print((failure.text or "")[:4000])
          PY
