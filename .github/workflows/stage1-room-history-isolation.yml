name: Stage 1 Room History Isolation

on:
  pull_request:
    branches:
      - feature/stage1-memory-storage-v16-2026-11-10

permissions:
  contents: read

concurrency:
  group: elsewhere-room-isolation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  room-flow-isolation:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'chore/stage1-chat-harness-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    name: Room history isolation trial ${{ matrix.trial }}
    steps:
      - name: Check out review branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Test Room initial flow and ChatDetailViewModel readiness offline
        run: |
          bash ./gradlew :app:testSandboxUnitTest --no-daemon \
            --tests com.example.ChatHistoryFlowIsolationTest \
            --tests com.example.ChatDetailGenerationTest.freshEmptyChatHydratesHistoryBeforeAnyMessageOrProviderCall \
            --tests com.example.ChatDetailGenerationTest.knownTextOnlyModelBlocksImageGenerationBeforeProviderRequest \
            --tests com.example.ChatDetailGenerationTest.finishedMisspelledNpcMarkerIsNotPersistedOrAppliedToExistingNpc
      - name: Print exact failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for report in Path("app/build/test-results/testSandboxUnitTest").glob("TEST-*.xml"):
              for case in ET.parse(report).getroot().iter("testcase"):
                  for failure in (*case.findall("failure"), *case.findall("error")):
                      print("FAIL:", case.get("classname"), case.get("name"))
                      print(failure.get("message", ""))
                      print((failure.text or "")[:5000])
          PY
