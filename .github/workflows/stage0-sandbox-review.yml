name: Stage 0 Sandbox APK and Backup Review

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Keep the review package opt-in to Stage 0 feature branches.
concurrency:
  group: elsewhere-stage0-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-review:
    name: Verify backup integrity and build isolated sandbox
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'chore/stage0-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Verify encrypted backup and restore, historical migrations and World continuity
        run: |
          bash ./gradlew :app:testSandboxUnitTest --no-daemon \
            --tests com.example.domain.backup.BackupCryptoTest \
            --tests com.example.domain.backup.BackupRepositoryTest \
            --tests com.example.AppDatabaseMigrationTest \
            --tests com.example.WorldArchiveAdditiveRestorerTest \
            --tests com.example.WorldArchiveTransferCoordinatorTest \
            --tests com.example.WorldRepositoryTest \
            --tests com.example.WorldEpisodeContextCompilerTest \
            --tests com.example.domain.Stage0MemoryIsolationTest
      - name: Build isolated sandbox APK
        run: bash ./gradlew :app:assembleSandbox --no-daemon --no-configuration-cache
      - name: Verify sandbox identity, signature and native library packaging
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/sandbox/app-sandbox.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$apk"
          package="$("$tools/aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          version_code="$("$tools/aapt" dump badging "$apk" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          version_name="$("$tools/aapt" dump badging "$apk" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
          test "$package" = "com.aistudio.elsewhere.abwzy.test"
          test "$package" != "com.aistudio.elsewhere.abwzy.v15"
          test "$version_code" = "3"
          test "$version_name" = "1.5.2-test"
          "$tools/apksigner" verify --verbose "$apk"
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          apk = "app/build/outputs/apk/sandbox/app-sandbox.apk"
          with ZipFile(apk) as archive:
              libs = [item for item in archive.infolist()
                      if item.filename.startswith("lib/") and item.filename.endswith(".so")]
              assert libs, "Expected native libraries"
              assert all(item.compress_type == ZIP_DEFLATED for item in libs), "Native libs must be compressed"
          print(f"Verified {len(libs)} compressed native libraries")
          PY
          {
            echo "Purpose: isolated Stage 0 manual review; NEVER an in-place production update"
            echo "Expected production package: com.aistudio.elsewhere.abwzy.v15"
            echo "Sandbox package: $package"
            echo "Version: $version_name ($version_code)"
            echo "Source commit: $GITHUB_SHA"
            sha256sum "$apk"
          } | tee app/build/outputs/apk/sandbox/stage0-apk-verification.txt
      - name: Upload sandbox APK and verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: Elsewhere-Stage0-Isolated-Sandbox-Review
          path: |
            app/build/outputs/apk/sandbox/app-sandbox.apk
            app/build/outputs/apk/sandbox/stage0-apk-verification.txt
          retention-days: 14
          if-no-files-found: error
      - name: Print exact test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path("app/build/test-results/testSandboxUnitTest").glob("TEST-*.xml"):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for failure in (*case.findall("failure"), *case.findall("error")):
                      print(f"FAIL {case.get('classname')}.{case.get('name')}: {failure.get('message', '')}")
                      print((failure.text or '')[:2500])
          PY
