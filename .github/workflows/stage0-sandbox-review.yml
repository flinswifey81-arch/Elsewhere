name: Stage 0 Sandbox APK and Backup Review

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Keep the review package opt-in to Stage 0 feature branches.
concurrency:
  group: elsewhere-stage0-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-review:
    name: Verify backup integrity and build isolated sandbox
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'chore/stage0-'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Verify encrypted backup and restore, historical migrations and World continuity
        run: |
          bash ./gradlew :app:testSandboxUnitTest --no-daemon \
            --tests com.example.domain.backup.BackupCryptoTest \
            --tests com.example.domain.backup.BackupRepositoryTest \
            --tests com.example.AppDatabaseMigrationTest \
            --tests com.example.WorldArchiveAdditiveRestorerTest \
            --tests com.example.WorldArchiveTransferCoordinatorTest \
            --tests com.example.WorldRepositoryTest \
            --tests com.example.WorldEpisodeContextCompilerTest \
            --tests com.example.domain.Stage0MemoryIsolationTest
      - name: Select reusable Test signing or isolated one-off review signing
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.ELSEWHERE_TEST_KEYSTORE_BASE64 }}
          TEST_STORE_PASSWORD: ${{ secrets.ELSEWHERE_TEST_STORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.ELSEWHERE_TEST_KEY_ALIAS }}
          TEST_KEY_PASSWORD: ${{ secrets.ELSEWHERE_TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=0
          for value in TEST_KEYSTORE_BASE64 TEST_STORE_PASSWORD TEST_KEY_ALIAS TEST_KEY_PASSWORD; do
            if [ -n "${!value}" ]; then
              present=$((present + 1))
            fi
          done
          if [ "$present" -eq 4 ]; then
            umask 077
            printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/elsewhere-test.jks"
            echo "ELSEWHERE_REVIEW_SIGNING=stable-test" >> "$GITHUB_ENV"
            echo "Using configured stable Elsewhere Test signer."
          elif [ "$present" -eq 0 ]; then
            echo "ELSEWHERE_REVIEW_SIGNING=one-off-debug" >> "$GITHUB_ENV"
            echo "::warning::Dedicated Test signer is not configured. This APK uses an ephemeral debug signer and may not update an existing Elsewhere Test installation. Do not uninstall Test data to force installation."
          else
            echo "::error::Partial Test signing configuration; refusing to build with ambiguous signing." >&2
            exit 1
          fi
      - name: Build isolated sandbox APK
        env:
          ELSEWHERE_TEST_KEYSTORE_PATH: ${{ runner.temp }}/elsewhere-test.jks
          ELSEWHERE_TEST_STORE_PASSWORD: ${{ secrets.ELSEWHERE_TEST_STORE_PASSWORD }}
          ELSEWHERE_TEST_KEY_ALIAS: ${{ secrets.ELSEWHERE_TEST_KEY_ALIAS }}
          ELSEWHERE_TEST_KEY_PASSWORD: ${{ secrets.ELSEWHERE_TEST_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleSandbox --no-daemon --no-configuration-cache
      - name: Verify sandbox identity, stable Test signature and native library packaging
        env:
          TEST_STORE_PASSWORD: ${{ secrets.ELSEWHERE_TEST_STORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.ELSEWHERE_TEST_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/sandbox/app-sandbox.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$apk"
          package="$("$tools/aapt" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          version_code="$("$tools/aapt" dump badging "$apk" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
          version_name="$("$tools/aapt" dump badging "$apk" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
          test "$package" = "com.aistudio.elsewhere.abwzy.test"
          test "$package" != "com.aistudio.elsewhere.abwzy.v15"
          test "$version_code" = "3"
          test "$version_name" = "1.5.2-test"
          signer_report="$("$tools/apksigner" verify --verbose --print-certs "$apk")"
          actual_certificate="$(printf '%s\n' "$signer_report" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          test -n "$actual_certificate"
          test "$actual_certificate" != "7c1fa02f0732d179d509d5333afa40933743e3c5dc8b70ef0aff2607c1e759f5"
          if [ "$ELSEWHERE_REVIEW_SIGNING" = "stable-test" ]; then
            expected_certificate="$(keytool -exportcert -keystore "$RUNNER_TEMP/elsewhere-test.jks" -storepass:env TEST_STORE_PASSWORD -alias "$TEST_KEY_ALIAS" | openssl dgst -sha256 -r | awk '{print $1}')"
            test "$actual_certificate" = "$expected_certificate"
          else
            test "$ELSEWHERE_REVIEW_SIGNING" = "one-off-debug"
            echo "::warning::Verified a one-off debug-signed sandbox. Android upgrades of a prior Test app are NOT guaranteed."
          fi
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          apk = "app/build/outputs/apk/sandbox/app-sandbox.apk"
          with ZipFile(apk) as archive:
              libs = [item for item in archive.infolist()
                      if item.filename.startswith("lib/") and item.filename.endswith(".so")]
              assert libs, "Expected native libraries"
              assert all(item.compress_type == ZIP_DEFLATED for item in libs), "Native libs must be compressed"
          print(f"Verified {len(libs)} compressed native libraries")
          PY
          {
            echo "Purpose: isolated Stage 0 manual review; NEVER an in-place production update"
            echo "Expected production package: com.aistudio.elsewhere.abwzy.v15"
            echo "Sandbox package: $package"
            echo "Version: $version_name ($version_code)"
            echo "Signing mode: $ELSEWHERE_REVIEW_SIGNING"
            echo "Sandbox signer SHA-256: $actual_certificate"
            if [ "$ELSEWHERE_REVIEW_SIGNING" = "one-off-debug" ]; then
              echo "WARNING: Ephemeral signer. Do not overwrite an existing Elsewhere Test installation; Android may report an incompatible signature."
            fi
            echo "Source PR head: ${{ github.event.pull_request.head.sha || github.sha }}"
            sha256sum "$apk"
          } | tee app/build/outputs/apk/sandbox/stage0-apk-verification.txt
      - name: Remove temporary Test signing key
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/elsewhere-test.jks" ]; then
            shred --remove "$RUNNER_TEMP/elsewhere-test.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/elsewhere-test.jks"
          fi
      - name: Upload sandbox APK and verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: Elsewhere-Stage0-Isolated-Sandbox-Review
          path: |
            app/build/outputs/apk/sandbox/app-sandbox.apk
            app/build/outputs/apk/sandbox/stage0-apk-verification.txt
          retention-days: 14
          if-no-files-found: error
      - name: Print exact test failures
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path("app/build/test-results/testSandboxUnitTest").glob("TEST-*.xml"):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for failure in (*case.findall("failure"), *case.findall("error")):
                      print(f"FAIL {case.get('classname')}.{case.get('name')}: {failure.get('message', '')}")
                      print((failure.text or '')[:2500])
          PY
