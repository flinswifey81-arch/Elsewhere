name: Pre-freeze Regression Tests (manual Test APK optional)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/solo-ensemble-co-leads
      - feature/final-freeze-fixes-2026-10-31

# Keep one active build per pull request/branch: frequent exploratory commits
# should not launch overlapping resource-heavy Robolectric suites.
concurrency:
  group: temporary-elsewhere-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Run pre-freeze compatibility regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run focused pre-freeze regression tests
        run: |
          bash ./gradlew :app:testSandboxUnitTest --no-daemon \
            --tests com.example.AppDatabaseMigrationTest \
            --tests com.example.WorldRepositoryTest \
            --tests com.example.WorldDefinitionCodecTest \
            --tests com.example.WorldsScreenTest \
            --tests com.example.EnsembleCoLeadContextTest \
            --tests com.example.domain.backup.BackupCryptoTest \
            --tests com.example.domain.backup.BackupRepositoryTest \
            --tests com.example.domain.memory.StoryMemoryEligibilityPolicyTest \
            --tests com.example.domain.StoryMemoryStorageTest \
            --tests com.example.ChatDetailGenerationTest \
            --tests com.example.RetainedChatViewModelStoresTest \
            --tests com.example.ReplyNotificationPolicyTest \
            --tests com.example.ChatSettingsScreenInitTest \
            --tests com.example.EndpointSelectionPersistenceTest \
            --tests com.example.LorebookRepositoryTest \
            --tests com.example.ChatLorebooksScreenTest \
            --tests com.example.GroupCharacterControlsTest \
            --tests com.example.LorebookUiTest.manualEditorExposesAllLoreEntryControls \
            --tests com.example.LorebookUiTest.pastedJsonPreviewShowsStoryScopeAndEntryDetailsBeforeImport

      - name: Print test failure details
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          for path in glob.glob("app/build/test-results/testSandboxUnitTest/TEST-*.xml"):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  for failure in (*case.findall("failure"), *case.findall("error")):
                      print(f"FAIL: {case.get('classname')}.{case.get('name')}")
                      print(failure.get("message", ""))
                      print((failure.text or "")[:5000])
          PY

      - name: Build temporary sandbox APK only when manually requested
        if: github.event_name == 'workflow_dispatch'
        run: bash ./gradlew :app:assembleSandbox --no-daemon

      - name: Verify native libraries are compressed for device installation
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          apk = "app/build/outputs/apk/sandbox/app-sandbox.apk"
          with ZipFile(apk) as archive:
              libraries = [item for item in archive.infolist()
                           if item.filename.startswith("lib/") and item.filename.endswith(".so")]
              assert libraries, "Expected native libraries to verify."
              incompatible = [item.filename for item in libraries
                              if item.compress_type != ZIP_DEFLATED]
              if incompatible:
                  raise SystemExit("Uncompressed native libs remain: " + ", ".join(incompatible))
              print(f"Verified {len(libraries)} native libraries packaged compressed.")
          PY

      - name: Upload temporary test APK only when manually requested
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Elsewhere-Temporary-Test-APK
          path: app/build/outputs/apk/sandbox/app-sandbox.apk
          if-no-files-found: error
          retention-days: 14
