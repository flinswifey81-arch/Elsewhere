name: Build Temporary Elsewhere Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/solo-ensemble-co-leads

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build temporary app-sandbox.apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run sandbox unit tests
        run: bash ./gradlew :app:testSandboxUnitTest --no-daemon

      - name: Build temporary sandbox APK
        run: bash ./gradlew :app:assembleSandbox --no-daemon

      - name: Verify native libraries are compressed for device installation
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          apk = "app/build/outputs/apk/sandbox/app-sandbox.apk"
          with ZipFile(apk) as archive:
              libraries = [item for item in archive.infolist()
                           if item.filename.startswith("lib/") and item.filename.endswith(".so")]
              assert libraries, "Expected native libraries to verify."
              incompatible = [item.filename for item in libraries
                              if item.compress_type != ZIP_DEFLATED]
              if incompatible:
                  raise SystemExit("Uncompressed native libs remain: " + ", ".join(incompatible))
              print(f"Verified {len(libraries)} native libraries packaged compressed.")
          PY

      - name: Upload temporary test APK
        uses: actions/upload-artifact@v4
        with:
          name: Elsewhere-Temporary-Test-APK
          path: app/build/outputs/apk/sandbox/app-sandbox.apk
          if-no-files-found: error
          retention-days: 14
