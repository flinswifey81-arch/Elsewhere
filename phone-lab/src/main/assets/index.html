<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#12101c"><title>Elsewhere • Phone concept</title>
<style>
:root{color-scheme:dark;--bg:#12101c;--surface:#211c30;--line:#403654;--ink:#fbf4ff;--muted:#c5b6d6;--accent:#e8b8ff;--mint:#a4f0d6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#312144,var(--bg) 42%);color:var(--ink);font:16px/1.5 system-ui,sans-serif;min-height:100dvh}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:44px;padding:9px 14px}button:hover,button:focus-visible{border-color:var(--accent)}button.primary{color:#241438;background:var(--accent);border-color:transparent;font-weight:750}input,textarea,select{background:#171221;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}textarea{width:100%;resize:vertical}.w{width:min(100%,580px);margin:auto;min-height:100dvh;padding:0 17px 26px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 0}.eyebrow{text-transform:uppercase;letter-spacing:.15em;color:var(--accent);font-size:12px;font-weight:800}.muted,small{color:var(--muted)}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,serif;font-weight:500;line-height:1.12}h1{font-size:clamp(2.4rem,10vw,4rem)}h2{font-size:2rem}p+p{margin-top:12px}.card,.hero,.bubble{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:16px}.hero{background:linear-gradient(135deg,#452756,#241a39 72%);position:relative;overflow:hidden;padding:22px;min-height:200px}.hero:after{content:'✦';position:absolute;right:16px;top:-30px;font-size:165px;color:#ffffff0e;pointer-events:none}.hero.alt{background:linear-gradient(135deg,#244637,#192a3c)}.stack{display:grid;gap:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.gap{margin-top:16px}.wide{width:100%;text-align:left}.story{font:19px/1.7 Georgia,serif}.phone{background:linear-gradient(165deg,#321b3c,#1b192a 55%);border:1px solid var(--line);border-radius:27px;padding:16px}.phone.alt{background:linear-gradient(165deg,#153a39,#191b30 55%);--accent:#a4f0d6}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.tabs [aria-selected=true]{background:var(--accent);color:#201429;font-weight:750}.bubble{max-width:90%;border-radius:18px 18px 18px 5px;padding:10px 13px}.mine{margin-left:auto;background:#543571;border-radius:18px 18px 5px 18px}.composer{display:flex;gap:8px}.composer input{flex:1}.small-button{font-size:14px}.rumor{color:#ffda99}.feed strong{display:block}.reply{border-left:2px solid var(--line);padding:9px 0 4px 12px;margin-top:8px}dialog{color:var(--ink);background:#211c30;border:1px solid var(--line);border-radius:20px;padding:20px;width:min(calc(100% - 30px),485px)}dialog::backdrop{background:#000a}footer{margin-top:20px;font-size:13px;color:var(--muted)}[hidden]{display:none!important}
</style><main class="w"><header><div class="eyebrow">✦ Elsewhere</div><small>Interactive concept</small></header><div id="view"></div><footer>Fictional sample data • Scripted replies • No connection to your Elsewhere chats</footer></main>
<dialog id="save"><form id="saveForm"><div class="eyebrow">Only what you choose carries over</div><h2 id="saveTitle"></h2><label class="stack gap">What should the story remember?<textarea id="note" rows="4" required></textarea></label><label class="stack gap" id="scopeLabel">Where should it apply?<select id="scope"><option>This Playthrough</option><option>World Canon (draft)</option></select></label><p class="muted gap" id="saveHint"></p><div class="row gap"><button type="button" data-act="close">Cancel</button><button class="primary">Save in demo</button></div></form></dialog>
<script>
const worlds=[
{name:"Hero Society",campaign:"Lillypad: First Response",chapter:"Chapter 2 · After the reveal",persona:"Lillypad",network:"HeroConnect",lead:"Bakugo",npc:"Mika • Dispatch",leadText:"Rooftop training garden. Eight. Don’t make me come get you.",npcText:"Dispatch confirmed the rescue drill starts at nine.",memory:"Lillypad and Bakugo agreed to meet at eight.",lore:"The agency has a rooftop training garden.",scene:"The last elevator chimes behind you. Beyond the agency windows, the city looks almost quiet.",line:"Bakugo checks the time, glances toward the stairwell, and waits.",author:"Dynamight Hero Agency",handle:"@DynamightAgency",post:"Meet Pro Hero Lillypad, the newest member of our rescue division. 🌸",fan:"@LillypadFiles",reply:"The seed vials on that utility belt. We’re already fans.",guess:"Are we getting public rescue demos next? No announcement yet."},
{name:"Afterglow Idol AU",campaign:"Blue Hour",chapter:"Chapter 1 · The teaser drops",persona:"Jina",network:"Encore",lead:"Minseo",npc:"Dae • Tour manager",leadText:"Studio B after the broadcast? I want you to hear the bridge before anybody else.",npcText:"Call time moved to 6:30. I’ll send the revised schedule.",memory:"Jina and Minseo planned to meet in Studio B after the broadcast.",lore:"The label has a private recording room called Studio B.",scene:"The teaser hits the timeline just as the music show’s floor manager calls places.",line:"Minseo catches your eye in the mirror, taps the edge of her phone, and heads toward the stage.",author:"Meridian Music",handle:"@MeridianMusic",post:"AFTERGLOW ✦ BLUE HOUR. The first comeback teaser is here.",fan:"@GlowSubs",reply:"Translation note: Blue Hour is the single title, not the album title.",guess:"Is that Jina on the bridge? Just a guess. Nothing confirmed."}];
let idx=0,page="worlds",tab="text",contact=null,mode="",messageIndex=0;const state=worlds.map(()=>({draft:"",on:true,threads:[[],[]],notes:[],refreshed:false})); const view=document.querySelector("#view"),dialog=document.querySelector("#save");const esc=s=>String(s).replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));
const b=(act,t,cls="")=>'<button type="button" data-act="'+act+'" class="'+cls+'">'+t+'</button>';
function render(focus=true){const w=worlds[idx],s=state[idx];if(page==="worlds"){view.innerHTML='<div class="eyebrow">Your stories</div><h1>Worlds</h1><p class="muted gap">Pick up where you left off.</p><div class="stack gap">'+worlds.map((x,i)=>'<article class="hero '+(i?'alt':'')+'"><div class="eyebrow">'+x.name+'</div><h2 class="gap">'+x.campaign+'</h2><p class="muted">'+x.chapter+'</p><div class="gap">'+b("resume"+i,"Continue →","primary")+'</div></article>').join("")+'</div>';}
else if(page==="story"){view.innerHTML='<div class="row between">'+b("worlds","‹ Worlds")+'<div class="row">'+b("menu","⋯ Menu")+b("phone","▣ Phone","primary")+'</div></div><div id="chatMenu" class="gap" hidden>'+b("phone","Persona’s Phone")+'</div><div class="eyebrow gap">'+w.chapter+'</div><h2>Main Story Chat</h2><p class="muted">'+w.campaign+' · Playing as '+w.persona+'</p><article class="card gap story"><p>'+w.scene+'</p><p>'+w.line+'</p></article><div class="stack gap"><label for="draft">Your scene draft</label><textarea rows="3" id="draft" placeholder="Write your next move…">'+esc(s.draft)+'</textarea></div>'+ (s.notes.length?'<div class="card gap"><strong>Carried into the story</strong>'+s.notes.map(n=>'<p><small>'+esc(n.kind)+'</small><br>'+esc(n.text)+'</p>').join("")+'</div>':"");}
else {const name=contact===0?w.lead:w.npc;const texts=contact===null?[]:[{body:contact===0?w.leadText:w.npcText},...s.threads[contact]];view.innerHTML='<div class="row between">'+b("story","‹ Main Story Chat")+'<small>'+w.persona+'</small></div><section class="phone gap '+(idx?'alt':'')+'"><div class="eyebrow">'+w.campaign+'</div><h2>Persona’s Phone</h2><nav class="tabs" role="tablist" aria-label="Phone apps"><button role="tab" aria-selected="'+(tab==="text")+'" data-act="text">Texting</button><button role="tab" aria-selected="'+(tab==="feed")+'" data-act="feed">World Pulse</button></nav>'+
(tab==="text"?(contact===null?'<div class="stack"><h3>Inbox</h3>'+b("contact0","<strong>"+w.lead+"</strong><br><small>Lead character</small>","wide")+b("contact1","<strong>"+w.npc+"</strong><br><small>NPC</small>","wide")+'</div>':'<div class="stack"><div class="row between">'+b("inbox","‹ Inbox")+'<h3>'+name+'</h3></div>'+texts.map((m,i)=>'<div class="bubble '+(m.mine?'mine':'')+'">'+esc(m.body)+'</div><div class="row">'+b("memory"+i,"Save to Story Memory","small-button")+b("lore"+i,"Make Lore","small-button")+'</div>').join("")+'<form id="textForm" class="composer"><input id="msg" aria-label="Text message" placeholder="Text '+name+'…" maxlength="400" required><button class="primary">Send</button></form></div>'):
'<div class="row between"><h3>'+w.network+'</h3>'+b("toggle",s.on?"Turn off":"Turn on","small-button")+'</div>'+(!s.on?'<p class="gap muted">World Pulse is off in this playthrough. Your inbox still works.</p>':'<div class="row between gap"><small>Public timeline</small>'+b("refresh","↻ Refresh feed","small-button")+'</div><div class="card feed gap"><strong>'+w.author+'</strong><small>'+w.handle+' · Public announcement</small><p class="gap">'+w.post+'</p><div class="reply"><strong>'+w.fan+'</strong>'+w.reply+'</div><div class="reply"><strong class="rumor">Fan speculation · Not canon</strong>'+w.guess+'</div></div>'+(s.refreshed?'<div class="card feed gap"><strong>'+(idx?'@BridgeClub':'@RescueWatch')+'</strong><small>One new scripted update</small><p>'+(idx?'Already putting the teaser on repeat.':'Happy to see the rescue division getting some love.')+'</p></div>':"")))+'</section>'}
if(focus){const heading=view.querySelector("h1,h2");if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}}}
function action(a){const s=state[idx],w=worlds[idx];if(a==="close"){dialog.close();return}if(a==="menu"){const el=document.querySelector("#chatMenu");el.hidden=!el.hidden;return}if(a.startsWith("resume")){idx=Number(a.slice(-1));page="story";tab="text";contact=null}
else if(a==="worlds"||a==="story"||a==="phone"){page=a}
else if(a==="text"||a==="feed"){tab=a}
else if(a==="inbox"){contact=null}
else if(a.startsWith("contact")){contact=Number(a.slice(-1))}
else if(a==="toggle"){s.on=!s.on}
else if(a==="refresh"){s.refreshed=true}
else if(/^(memory|lore)\d+$/.test(a)){mode=a.startsWith("lore")?"Lore":"Story Memory";messageIndex=Number(a.match(/\d+$/)[0]);document.querySelector("#saveTitle").textContent=mode==="Lore"?"Make Lore":"Save to Story Memory";const source=messageIndex===0?(contact===0?w.leadText:w.npcText):s.threads[contact][messageIndex-1].body;document.querySelector("#note").value=messageIndex===0&&contact===0?(mode==="Lore"?w.lore:w.memory):source;document.querySelector("#scope").selectedIndex=0;document.querySelector("#scopeLabel").hidden=mode!=="Lore";document.querySelector("#saveHint").textContent=mode==="Lore"?"Saving a fact never publishes the private conversation.":"Private to this playthrough and the people in the conversation.";dialog.showModal();return}
else return;render();window.scrollTo(0,0)}
document.addEventListener("click",e=>{const target=e.target.closest("[data-act]");if(target)action(target.dataset.act)});
document.addEventListener("input",e=>{if(e.target.id==="draft")state[idx].draft=e.target.value});
document.addEventListener("submit",e=>{if(e.target.id==="saveForm"){e.preventDefault();const text=document.querySelector("#note").value.trim();if(!text)return;state[idx].notes.push({kind:mode==="Lore"?document.querySelector("#scope").value:mode,text});dialog.close();return}if(e.target.id==="textForm"){e.preventDefault();const val=document.querySelector("#msg").value.trim();if(!val)return;const msgs=state[idx].threads[contact];msgs.push({mine:true,body:val},{body:contact===0?(idx?"Sounds good. I’ll see you after the broadcast.":"Got it. See you up there."):(idx?"Got it. I’ll update the schedule.":"Copy that. I’ll let dispatch know.")});render(false);document.querySelector("#msg").focus()}});
window.labBack=()=>{if(dialog.open){dialog.close();return true}if(page==="phone"){if(tab==="text"&&contact!==null){action("inbox");return true}action("story");return true}if(page==="story"){action("worlds");return true}return false};
render();
</script></html>
